<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dart Lions – Arena Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font:16px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:2px solid #a92129;padding-bottom:20px}h1,h2,h3{color:#e3bc59;margin:0 0 14px}h1{font-size:25px}small,.muted{color:#aaa}section,article{background:#202020;border:1px solid #393939;border-radius:12px;padding:20px;margin:20px 0}#login{max-width:460px;margin:40px auto}label{display:block;margin:12px 0 5px}input,select,button{font:inherit;border-radius:6px;padding:10px}input:not([type=checkbox]),select{width:100%;background:#111;color:#fff;border:1px solid #555}button{background:#a92129;color:#fff;border:0;cursor:pointer}button.secondary{background:#414141}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #e3bc59} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.ad{display:grid;grid-template-columns:180px 1fr;gap:18px}.ad img,#preview{width:100%;max-height:260px;object-fit:contain;background:#111;border-radius:8px}.status{color:#e3bc59;font-weight:600}.error{color:#ff9696}.success{color:#96e3a5}[hidden]{display:none!important}#notice{white-space:pre-wrap}a{color:#e3bc59}@media(max-width:550px){main{padding:12px}.ad{grid-template-columns:1fr}.ad img{max-height:220px}section,article{padding:14px}}
textarea{width:100%;background:#111;color:#fff;border:1px solid #555;border-radius:6px;padding:10px;font:inherit;resize:vertical}.ad-preview{text-align:center;margin-top:12px;background:#111;border-radius:8px;padding:12px}.ad-preview p{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}#previewHeadline{font-size:24px;font-weight:800;color:#e3bc59}#previewSubtitle{font-size:17px;color:#eee}</style></head><body><main><header><div><small>DART LIONS GRÄFENBERG</small><h1>LIVE ARENA · Administration</h1></div><button id="logout" class="secondary" hidden>Abmelden</button></header><p id="notice" role="status" aria-live="polite"></p><section id="login"><h2>Anmelden</h2><p class="muted">Nur für berechtigte Administratoren.</p><form id="loginForm"><label for="email">E-Mail-Adresse</label><input id="email" type="email" autocomplete="username" required><label for="password">Passwort</label><input id="password" type="password" autocomplete="current-password" required><div class="actions"><button type="submit">Anmelden</button></div></form></section><div id="dashboard" hidden><section><h2>Werbeverwaltung</h2><p class="muted">Zeiten: Deutschland (Europe/Berlin) · Bilder im Originalformat · maximal 5 MB</p><button id="newAd">+ Neue Werbung</button><button class="secondary" id="refresh">Aktualisieren</button></section><section id="editor" hidden><h2 id="editorTitle">Neue Werbung</h2><form id="adForm"><label for="title">Interner Titel</label><input id="title" maxlength="150" required><label for="headline">Öffentliche Überschrift (optional)</label><input id="headline" maxlength="150"><label for="subtitle">Öffentlicher Untertitel (optional)</label><textarea id="subtitle" maxlength="300" rows="3"></textarea><label for="file">Werbebild (JPG, PNG, WebP)</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp"><label for="reuse">Oder vorhandenes Bild wiederverwenden</label><select id="reuse"><option value="">– Kein Bild ausgewählt –</option></select><div class="ad-preview"><p id="previewHeadline" hidden></p><img id="preview" alt="Werbevorschau" hidden><p id="previewSubtitle" hidden></p></div><div class="grid"><div><label for="start">Startdatum und Uhrzeit</label><input type="datetime-local" id="start" required></div><div><label for="end">Enddatum und Uhrzeit</label><input type="datetime-local" id="end"><label><input type="checkbox" id="permanent"> Ohne Enddatum</label></div><div><label for="duration">Anzeigedauer (Sekunden)</label><input type="number" id="duration" min="5" max="120" value="15" required></div><div><label for="priority">Priorität</label><select id="priority"><option value="1">1 – Normal</option><option>2</option><option>3</option><option>4</option><option value="5">5 – Höchste</option></select></div></div><label><input type="checkbox" id="active" checked> Werbung aktiviert</label><div class="actions"><button type="submit">Speichern</button><button type="button" id="cancel" class="secondary">Abbrechen</button></div></form></section><section><h2>Werbeanzeigen</h2><label for="filter">Filtern</label><select id="filter"><option value="all">Alle Anzeigen</option><option value="Aktiv">Aktiv</option><option value="Geplant">Geplant</option><option value="Abgelaufen">Archiv / abgelaufen</option><option value="Inaktiv">Inaktiv</option></select><div id="ads"></div></section></div></main><script>
'use strict';
const db=supabase.createClient('https://lugyxehsiwzipuczcvzc.supabase.co','sb_publishable_OHknyyF6x9lm_KIqO76rKw_pJGvOmTA');
const $=id=>document.getElementById(id);const bucket=db.storage.from('arena-ads');let rows=[],editing=null,authorized=false,blob=null,loading=false;
function notice(msg,err=false){$('notice').textContent=msg;$('notice').className=err?'error':'success'}
function fail(e){notice(e?.message||String(e),true)}
const formatter=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function berlin(iso){return formatter.format(new Date(iso)).replace(' ','T')}
function utc(s){if(!s)return null;const t=Date.parse(s+'Z');const matches=[1,2].map(h=>new Date(t-h*3600000)).filter(d=>berlin(d)===s);if(matches.length!==1)throw Error('Diese Uhrzeit ist wegen der Zeitumstellung nicht eindeutig oder existiert nicht. Bitte andere Uhrzeit wählen.');return matches[0].toISOString()}
function status(a){if(!a.is_active)return 'Inaktiv';if(a.ends_at&&Date.parse(a.ends_at)<=Date.now())return 'Abgelaufen';if(Date.parse(a.starts_at)>Date.now())return 'Geplant';return 'Aktiv'}
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function btn(text,fn){const n=el('button',text,'secondary');n.type='button';n.onclick=()=>Promise.resolve().then(fn).catch(fail);return n}
async function check(session){authorized=false;$('dashboard').hidden=true;$('logout').hidden=!session;$('login').hidden=!!session;if(!session){rows=[];$('ads').replaceChildren();closeEditor();return}const {data,error}=await db.from('arena_admins').select('user_id').eq('user_id',session.user.id).maybeSingle();if(error||!data){notice('Kein Administratorzugriff. '+(error?.message||''),true);return}authorized=true;$('dashboard').hidden=false;await load()}
$('loginForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const {data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('password').value='';if(error)throw error;await check(data.session);if(authorized)notice('Angemeldet.')}catch(e){fail(e)}finally{b.disabled=false}};
$('logout').onclick=async()=>{const {error}=await db.auth.signOut();if(error)return fail(error);await check(null);notice('Abgemeldet.')};
async function signed(path){const {data,error}=await bucket.createSignedUrl(path,300);if(error)throw error;return data.signedUrl}
async function load(){if(!authorized)return;const {data,error}=await db.from('arena_ads').select('*').order('created_at',{ascending:false});if(error)throw error;rows=data;await render()}
async function render(){const target=$('ads');target.replaceChildren();const f=$('filter').value;const items=rows.filter(a=>f==='all'||status(a)===f);if(!items.length)target.append(el('p','Keine Anzeigen vorhanden.','muted'));for(const a of items){const card=el('article',undefined,'ad');const img=el('img');img.alt=a.title;card.append(img);signed(a.image_path).then(url=>img.src=url).catch(()=>img.alt='Bild nicht verfügbar');const info=el('div');info.append(el('h3',a.title),el('p',status(a),'status'),el('p',berlin(a.starts_at).replace('T',' ')+' – '+(a.ends_at?berlin(a.ends_at).replace('T',' '):'unbegrenzt')),el('p',a.display_seconds+' Sekunden · Priorität '+a.priority,'muted'));if(a.headline)info.append(el('p','Überschrift: '+a.headline));if(a.subtitle)info.append(el('p','Untertitel: '+a.subtitle));const actions=el('div',undefined,'actions');actions.append(btn('Bearbeiten',()=>openEditor(a)),btn(a.is_active?'Deaktivieren':'Aktivieren',()=>update(a.id,{is_active:!a.is_active})),btn('Erneut verwenden',()=>openEditor({...a,id:null,starts_at:new Date().toISOString(),ends_at:null,is_active:true})),btn('Löschen',()=>remove(a)));info.append(actions);card.append(info);target.append(card)}}
async function update(id,values){if(!authorized)return;const {error}=await db.from('arena_ads').update(values).eq('id',id);if(error)throw error;await load();notice('Anzeige aktualisiert.')}
async function remove(a){if(!authorized||!confirm('Anzeige „'+a.title+'“ wirklich löschen? Das Bild bleibt zur Wiederverwendung erhalten.'))return;const {error}=await db.from('arena_ads').delete().eq('id',a.id);if(error)throw error;await load();notice('Anzeige gelöscht. Bild bleibt gespeichert.')}
function syncTextPreview(){for(const [input,output] of [['headline','previewHeadline'],['subtitle','previewSubtitle']]){const value=$(input).value.trim();$(output).textContent=value;$(output).hidden=!value}}
$('headline').oninput=syncTextPreview;$('subtitle').oninput=syncTextPreview;
function clearPreview(){if(blob)URL.revokeObjectURL(blob);blob=null;$('preview').removeAttribute('src');$('preview').hidden=true}
function closeEditor(){editing=null;clearPreview();$('editor').hidden=true;$('adForm').reset()}
async function openEditor(a=null){editing=a;clearPreview();$('adForm').reset();$('editor').hidden=false;$('editorTitle').textContent=a?.id?'Werbung bearbeiten':'Neue Werbung';$('title').value=a?.title||'';$('headline').value=a?.headline||'';$('subtitle').value=a?.subtitle||'';syncTextPreview();$('start').value=berlin(a?.starts_at||new Date());$('end').value=a?.ends_at?berlin(a.ends_at):'';$('permanent').checked=!a?.ends_at;$('end').disabled=$('permanent').checked;$('duration').value=a?.display_seconds||15;$('priority').value=a?.priority||1;$('active').checked=a?.is_active??true;const sel=$('reuse');sel.replaceChildren(new Option('– Kein Bild ausgewählt –',''));const paths=new Map(rows.map(r=>[r.image_path,r.title]));if(a?.image_path)paths.set(a.image_path,a.title);for(const [p,t] of paths)sel.add(new Option(t,p));if(a?.image_path){sel.value=a.image_path;await showExisting()}$('editor').scrollIntoView({behavior:'smooth'})}
async function showExisting(){clearPreview();const path=$('reuse').value;if(!path)return;const url=await signed(path);if($('reuse').value===path&&!$('file').files.length){$('preview').src=url;$('preview').hidden=false}}
$('reuse').onchange=()=>{$('file').value='';showExisting().catch(fail)};$('file').onchange=()=>{clearPreview();const f=$('file').files[0];if(f){$('reuse').value='';blob=URL.createObjectURL(f);$('preview').src=blob;$('preview').hidden=false}};$('permanent').onchange=()=>{$('end').disabled=$('permanent').checked;$('end').required=!$('permanent').checked};$('newAd').onclick=()=>openEditor().catch(fail);$('cancel').onclick=closeEditor;$('refresh').onclick=()=>load().catch(fail);$('filter').onchange=()=>render().catch(fail);
$('adForm').onsubmit=async e=>{e.preventDefault();if(!authorized||loading)return;loading=true;e.submitter.disabled=true;let uploaded=null,saved=false;try{const title=$('title').value.trim();if(!title)throw Error('Bitte Titel eingeben.');const starts_at=utc($('start').value),ends_at=$('permanent').checked?null:utc($('end').value);if(!$('permanent').checked&&!ends_at)throw Error('Bitte Enddatum eingeben.');if(ends_at&&ends_at<=starts_at)throw Error('Ende muss nach dem Start liegen.');const f=$('file').files[0];let image_path=$('reuse').value;if(f){const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[f.type];if(!ext||f.size>5242880||!f.size)throw Error('Nur JPG, PNG, WebP bis 5 MB.');image_path=crypto.randomUUID()+'.'+ext;const {error}=await bucket.upload(image_path,f,{contentType:f.type,upsert:false});if(error)throw error;uploaded=image_path}if(!image_path)throw Error('Bitte ein Bild auswählen.');const values={title,headline:$('headline').value.trim()||null,subtitle:$('subtitle').value.trim()||null,image_path,starts_at,ends_at,display_seconds:Number($('duration').value),priority:Number($('priority').value),is_active:$('active').checked};const {error}=editing?.id?await db.from('arena_ads').update(values).eq('id',editing.id):await db.from('arena_ads').insert(values);if(error)throw error;saved=true;closeEditor();await load();notice('Werbung gespeichert.')}catch(err){if(uploaded&&!saved){const {error}=await bucket.remove([uploaded]);if(error)notice('Speichern fehlgeschlagen; Bildbereinigung ebenfalls fehlgeschlagen.',true);else fail(err)}else fail(err)}finally{loading=false;e.submitter.disabled=false}};
db.auth.getSession().then(({data,error})=>{if(error)throw error;return check(data.session)}).catch(fail);db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'||!session){authorized=false;$('dashboard').hidden=true;$('login').hidden=false;$('logout').hidden=true;rows=[];$('ads').replaceChildren();closeEditor()}});
</script></body></html>
