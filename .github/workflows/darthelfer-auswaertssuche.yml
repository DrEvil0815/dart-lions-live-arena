name: Darthelfer Auswärtsspiele automatisch suchen
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * 5,6,0'
permissions:
  contents: write
jobs:
  suchen:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Playwright installieren
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Darthelfer öffentliche Turniersuche prüfen
        run: python scripts/discover_darthelfer.py
      - name: Ergebnisdatei veröffentlichen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auswaerts-events.json
          if ! git diff --cached --quiet; then
            git commit -m 'Darthelfer: Auswärtsspiel-Fundliste aktualisieren'
            git push
          fi
