name: Darthelfer Auswärtsspiele automatisch suchen
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * 1,2,3,4'
    - cron: '*/30 * * * 5,6,0'
permissions:
  contents: write
concurrency:
  group: darthelfer-away-discovery
  cancel-in-progress: false
jobs:
  suchen:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Darthelfer öffentliche Turniere abrufen und Dart Lions suchen
        run: python discover_darthelfer.py
      - name: Ergebnisdatei veröffentlichen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auswaerts-events.json
          if ! git diff --cached --quiet; then
            git commit -m 'Darthelfer: Auswärtsspiel-Fundliste aktualisieren'
            git pull --rebase origin main
            git push
          fi
